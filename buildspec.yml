version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
  pre_build:
    commands:
      - echo Installing compiler dependencies...
      - npm install -g typescript @angular/compiler-cli@12.2.0
  build:
    commands:
      - echo Build started on `date`
      - npm install --legacy-peer-deps
      - echo Starting Angular compilation with Legacy OpenSSL support...
      - export NODE_OPTIONS=--openssl-legacy-provider && ./node_modules/.bin/ng build  # 👈 核心修改：注入兼容性环境变量
      - echo build completed on `date`
  post_build:
    commands:
      - echo Checking output directories...
      - ls -la
      - ls -la ./dist/shop || ls -la ./dist || echo "No dist folder yet"

artifacts:
  files:
    - ./dist/**/*
    - appspec.yml
