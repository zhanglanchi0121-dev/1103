version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
  pre_build:
    commands:
      # 登录到真实的 ECR 存储库
      - aws ecr get-login-password --region ap-northeast-1 | docker login --username AWS --password-stdin 381183037611.dkr.ecr.ap-northeast-1.amazonaws.com
  build:
    commands:
      - echo Build started on `date`
      - npm install --legacy-peer-deps
      - echo npm install completed on `date`
      # 注入环境变量，绕过老版本 Angular 的 OpenSSL 算法冲突报错
      - export NODE_OPTIONS=--openssl-legacy-provider && ./node_modules/.bin/ng build
      - echo build completed on `date`
      # 获取时间戳作为 Docker 镜像的唯一标签 (TAG)
      - TAG=`date +"%Y%m%d%H%M%S"`
      # 构建 Docker 镜像并打上真实的 ECR 标签
      - docker build -t 381183037611.dkr.ecr.ap-northeast-1.amazonaws.com/dp-ecr-httpd:$TAG ./
      - echo docker build completed on `date`
      # 将构建好的镜像推送到私有存储库
      - docker push 381183037611.dkr.ecr.ap-northeast-1.amazonaws.com/dp-ecr-httpd:$TAG
      - echo docker push completed on `date`
  post_build:
    commands:
        - echo Build completed on `date`
        # 彻底修复 printf 语法，将 %s 放在标签位置，并填写正确的完整 ECR 路径
        - printf '[{"name":"mynginx","imageUrl":"%s"}]\n' 381183037611.dkr.ecr.ap-northeast-1.amazonaws.com/dp-ecr-httpd:$TAG > imagedefinitions.json
        - cat imagedefinitions.json
artifacts:
  files: 
    - imagedefinitions.json