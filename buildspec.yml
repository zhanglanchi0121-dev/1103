version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
  pre_build:
    commands:
      - aws ecr get-login-password --region ap-northeast-1 | docker login --username AWS --password-stdin 381183037611.dkr.ecr.ap-northeast-1.amazonaws.com
  build:
    commands:
      - echo Build started on `date`
      - npm install --legacy-peer-deps
      - echo npm install completed on `date`
      - export NODE_OPTIONS=--openssl-legacy-provider && ./node_modules/.bin/ng build
      - echo build completed on `date`
      # 日付をイメージタグとして取得
      - TAG=`date +"%Y%m%d%H%M%S"`
      # 正しいアカウントIDのECRレポジトリ名でDockerイメージをビルド
      - docker build -t 381183037611.dkr.ecr.ap-northeast-1.amazonaws.com/dp-ecr-httpd:$TAG ./
      - echo docker build completed on `date`
      # ECRにイメージをプッシュ
      - docker push 381183037611.dkr.ecr.ap-northeast-1.amazonaws.com/dp-ecr-httpd:$TAG
      - echo docker push completed on `date`
  post_build:
    commands:
      - echo Build completed on `date`
      # ECSデプロイ用のimagedefinitions.jsonを作成 (アカウントIDを修正)
      - printf '[{"name":"mynginx","imageUrl":"%s"}]' ://amazonaws.com/dp-ecr-httpd:$TAG > imagedefinitions.json
      - cat imagedefinitions.json
artifacts:
  files: 
    - imagedefinitions.json
