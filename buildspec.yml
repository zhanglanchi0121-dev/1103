version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
  pre_build:
    commands:
      # 正しいアカウントID (381183037611) を使用してECRにログイン
      - aws ecr get-login-password --region ap-northeast-1 | docker login --username AWS --password-stdin ://amazonaws.com
  build:
    commands:
      - echo Build started on `date`
      - npm install --legacy-peer-deps
      - echo npm install completed on `date`
      # 旧バージョンAngularのOpenSSLエラーを回避する環境変数を追加してビルド
      - export NODE_OPTIONS=--openssl-legacy-provider && ./node_modules/.bin/ng build
      - echo build completed on `date`
      # 日付をイメージタグとして取得
      - TAG=`date +"%Y%m%d%H%M%S"`
      # 正しいアカウントIDのECRレポジトリ名でDockerイメージをビルド
      - docker build -t ://amazonaws.com/dp-ecr-httpd:$TAG ./
      - echo docker build completed on `date`
      # ECRにイメージをプッシュ
      - docker push ://amazonaws.com/dp-ecr-httpd:$TAG
      - echo docker push completed on `date`
  post_build:
    commands:
      - echo Build completed on `date`
      # ECSデプロイ用のimagedefinitions.jsonを作成 (アカウントIDを修正)
      - printf '[{"name":"mynginx","imageUrl":"%s"}]' ://amazonaws.com/dp-ecr-httpd:$TAG > imagedefinitions.json
      - cat imagedefinitions.json
artifacts:
  files:
    - imagedefinitions.json
